body{background:#111;color:#eee;font:16px system-ui;margin:0}
.top{position:sticky;top:0;background:#1b1b1b;padding:12px 20px;z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.strip{display:flex;gap:6px;overflow-x:auto;padding:0 20px 20px}.strip div{flex:0 0 auto;cursor:pointer;border:2px solid transparent;font-size:12px;color:#aaa}
.strip div.on{border-color:#e8a33a}.strip img{height:160px;width:auto;max-width:300px;display:block}</style>
