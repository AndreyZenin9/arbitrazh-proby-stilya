<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Рилс про криптоарбитраж · раскадровка 0–80 с</title><style>
body{background:#111;color:#eee;font:16px system-ui;margin:0}
.top{position:sticky;top:0;background:#1b1b1b;padding:12px 20px;z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top button{background:#333;color:#eee;border:1px solid #555;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:15px}
.top button.on{background:#e8a33a;color:#111;border-color:#e8a33a}
.stage{padding:16px 20px;display:flex;gap:24px;align-items:flex-start}
#big{width:auto;height:auto;max-width:72vw;max-height:calc(100vh - 290px);border:1px solid #333}.side{flex:1;min-width:260px}
@media (max-width:800px){.stage{flex-direction:column}#big{max-width:100%;max-height:calc(100vh - 150px)}.top{padding:8px}.top button{padding:6px 8px;font-size:13px}#say{font-size:19px}}
#say{font-size:24px;line-height:1.35;margin:4px 0 12px}#meta{color:#aaa}#must{color:#e8a33a;margin-top:10px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 20px 20px}.strip div{flex:0 0 auto;cursor:pointer;border:2px solid transparent;font-size:12px;color:#aaa}
.strip div.on{border-color:#e8a33a}.strip img{height:160px;width:auto;max-width:300px;display:block}</style>
<div class=top><span id=dirs></span><audio id=a src="../golos.m4a" controls preload=auto></audio><span style=color:#888>← → — кадры</span></div>
<div class=stage><img id=big><div class=side><div id=meta></div><div id=say></div><div id=must></div></div></div><div class=strip id=strip></div>
<script>const D={"rask": [{"f": "rask/frames/S01-1.jpg", "sc": "S01", "n": 0, "t": 0.0, "end": 3.12, "say": "Пока одни пытаются угадать, куда пойдёт цена,", "must": ""}, {"f": "rask/frames/S01-2.jpg", "sc": "S01", "n": 1, "t": 3.12, "end": 5.92, "say": "другие зарабатывают совершенно по-другому.", "must": ""}, {"f": "rask/frames/S01-3.jpg", "sc": "S01", "n": 2, "t": 5.92, "end": 8.92, "say": "Посмотрите на эти графики.", "must": ""}, {"f": "rask/frames/S02-1.jpg", "sc": "S02", "n": 0, "t": 7.6, "end": 10.72, "say": "Это одна и та же биржа и одна и та же монета.", "must": ""}, {"f": "rask/frames/S02-2.jpg", "sc": "S02", "n": 1, "t": 10.72, "end": 13.92, "say": "Но на споте и фьючерсах разные цены.", "must": ""}, {"f": "rask/frames/S02-3.jpg", "sc": "S02", "n": 2, "t": 13.92, "end": 15.21, "say": "В какой-то момент разница…", "must": ""}, {"f": "rask/frames/S02-4.jpg", "sc": "S02", "n": 3, "t": 15.21, "end": 17.05, "say": "…превысила 7 процентов.", "must": ""}, {"f": "rask/frames/S02-5.jpg", "sc": "S02", "n": 4, "t": 17.05, "end": 20.05, "say": "И вот здесь появляется арбитраж.", "must": ""}, {"f": "rask/frames/S03-1.jpg", "sc": "S03", "n": 0, "t": 19.61, "end": 22.41, "say": "Мы покупаем монету на споте, где она дешевле,", "must": ""}, {"f": "rask/frames/S03-2.jpg", "sc": "S03", "n": 1, "t": 22.41, "end": 24.98, "say": "и одновременно открываем шорт на фьючерсах,", "must": ""}, {"f": "rask/frames/S03-3.jpg", "sc": "S03", "n": 2, "t": 24.98, "end": 27.98, "say": "где она дороже.", "must": ""}, {"f": "rask/frames/S04-1.jpg", "sc": "S04", "n": 0, "t": 27.95, "end": 31.3, "say": "Представьте, что монета выросла на 50 процентов.", "must": ""}, {"f": "rask/frames/S04-2.jpg", "sc": "S04", "n": 1, "t": 31.3, "end": 32.83, "say": "На споте мы заработали.", "must": ""}, {"f": "rask/frames/S04-3.jpg", "sc": "S04", "n": 2, "t": 32.83, "end": 35.87, "say": "На шорте потеряли ровно по 50 процентов.", "must": ""}, {"f": "rask/frames/S04-4.jpg", "sc": "S04", "n": 3, "t": 35.87, "end": 39.5, "say": "А если она рухнет на 50 процентов? Всё наоборот.", "must": ""}, {"f": "rask/frames/S04-5.jpg", "sc": "S04", "n": 4, "t": 39.5, "end": 41.5, "say": "При одинаковом количестве монет…", "must": ""}, {"f": "rask/frames/S04-6.jpg", "sc": "S04", "n": 5, "t": 41.5, "end": 44.5, "say": "…эти результаты в основном компенсируют друг друга.", "must": ""}, {"f": "rask/frames/S05-1.jpg", "sc": "S05", "n": 0, "t": 43.98, "end": 45.98, "say": "Тогда на чём же мы зарабатываем?", "must": ""}, {"f": "rask/frames/S05-2.jpg", "sc": "S05", "n": 1, "t": 45.98, "end": 47.82, "say": "На разнице в ценах.", "must": ""}, {"f": "rask/frames/S05-3.jpg", "sc": "S05", "n": 2, "t": 47.82, "end": 50.3, "say": "Когда цены спота и фьючерсов сближаются,", "must": ""}, {"f": "rask/frames/S05-4.jpg", "sc": "S05", "n": 3, "t": 50.3, "end": 51.91, "say": "мы закрываем обе позиции", "must": ""}, {"f": "rask/frames/S05-5.jpg", "sc": "S05", "n": 4, "t": 51.91, "end": 54.91, "say": "и можем зафиксировать прибыль.", "must": ""}, {"f": "rask/frames/S06-1.jpg", "sc": "S06", "n": 0, "t": 53.59, "end": 55.43, "say": "Разумеется, с учётом комиссий,", "must": ""}, {"f": "rask/frames/S06-2.jpg", "sc": "S06", "n": 1, "t": 55.43, "end": 58.43, "say": "рисков и возможных ликвидаций.", "must": ""}, {"f": "rask/frames/S07-1.jpg", "sc": "S07", "n": 0, "t": 58.71, "end": 61.75, "say": "Пока большинство пытается предсказать движение рынка,", "must": ""}, {"f": "rask/frames/S07-2.jpg", "sc": "S07", "n": 1, "t": 61.75, "end": 65.88, "say": "мы используем ситуации, где угадывать направление вообще не нужно.", "must": ""}, {"f": "rask/frames/S07-3.jpg", "sc": "S07", "n": 2, "t": 65.88, "end": 68.88, "say": "Именно так работает криптовалютный арбитраж.", "must": ""}, {"f": "rask/frames/S08-1.jpg", "sc": "S08", "n": 0, "t": 68.75, "end": 71.88, "say": "Хотите научиться находить такие ситуации самостоятельно?", "must": ""}, {"f": "rask/frames/S08-2.jpg", "sc": "S08", "n": 1, "t": 71.88, "end": 74.67, "say": "В своём Telegram я показываю реальные сделки,", "must": ""}, {"f": "rask/frames/S08-3.jpg", "sc": "S08", "n": 2, "t": 74.67, "end": 78.11, "say": "разбираю стратегии и объясняю, как устроен арбитраж.", "must": ""}, {"f": "rask/frames/S08-4.jpg", "sc": "S08", "n": 3, "t": 78.11, "end": 81.11, "say": "Ссылка в шапке профиля.", "must": ""}]}, NAMES=[["rask", "Раскадровка · биржа + 3D"]];let cur=NAMES[0][0],idx=0;const a=document.getElementById('a');
function dirs(){document.getElementById('dirs').innerHTML=NAMES.map(([k,t])=>`<button class="${k==cur?'on':''}" onclick="setDir('${k}')">${t}</button>`).join(' ')}
function strip(){document.getElementById('strip').innerHTML=D[cur].map((x,i)=>`<div onclick="go(${i},true)"><img src="${x.f}">${x.sc}-${x.n} · ${x.t.toFixed(1)} с</div>`).join('')}
function show(i){idx=i;const x=D[cur][i];document.getElementById('big').src=x.f;document.getElementById('meta').textContent=`${x.sc} · кадр ${x.n} · ${x.t.toFixed(2)}–${x.end.toFixed(2)} с`;
document.getElementById('say').textContent='«'+x.say+'»';document.getElementById('must').textContent=x.must?('что показывает кадр: '+x.must):'';document.querySelectorAll('.strip div').forEach((e,j)=>e.classList.toggle('on',j==i))}
function go(i,s){show(i);if(s){a.currentTime=D[cur][i].t;a.play()}}function setDir(k){cur=k;dirs();strip();go(0,false);a.currentTime=D[cur][0].t}
a.addEventListener('timeupdate',()=>{const t=a.currentTime,F=D[cur];let j=0;for(let i=0;i<F.length;i++)if(F[i].t<=t+0.02)j=i;if(j!=idx)show(j)});
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(Math.min(idx+1,D[cur].length-1),true);if(e.key=='ArrowLeft')go(Math.max(idx-1,0),true)});setDir(cur);</script>
